<svg xmlns="http://www.w3.org/2000/svg" viewBox="118 140 462 750">
  <!--
    The Kindred mark, as the browser-tab icon.

    THE GEOMETRY IS DUPLICATED FROM src/components/KindredMark.tsx ON PURPOSE,
    and src/test/favicon.test.ts fails the build if the two ever drift. A tab
    icon is fetched as a static file by the browser before any JavaScript
    runs, so it cannot import the component; the choice is a duplicate guarded
    by a test, or a build step that generates this file. The test is cheaper
    and leaves the artwork readable in place.

    IT CARRIES LITERAL COLOURS, which the rest of the app may not (no hex
    outside src/styles/tokens.css — src/test/invariants.test.ts). That rule
    covers src/, and this file is in public/, deliberately: a tab has no theme
    context and no CSS custom properties to inherit, so `currentColor` would
    resolve to black. The values below are the two theme accents from
    tokens.css, kept in step by the same test.

    The stroke is 40 — KindredMark's small-size weight. A favicon renders at
    16-32px, below even the 24px anchor, so the heaviest tested weight is the
    right one: at that size only the silhouette survives regardless.
  -->
  <style>
    /* Night accent by default: it reads on a dark tab strip, and is still
       legible on a light one. Browsers that honour prefers-color-scheme in an
       SVG favicon (Chrome, Firefox) swap to the day accent on light. */
    :root { --mark: #e8b478; }
    @media (prefers-color-scheme: light) {
      :root { --mark: #8a5717; }
    }
  </style>
  <g fill="none" stroke="var(--mark)" stroke-width="40" stroke-linecap="round" stroke-linejoin="round">
    <path d="M 171 150 C 247 304 440 366 515 496 A 248 248 0 0 1 207 850"/>
    <circle cx="300" cy="620" r="170"/>
